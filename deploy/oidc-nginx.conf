# Disposable qualification ingress only; not a production exposure pattern.
access_log off;
error_log /dev/stderr crit;
ssl_certificate /fixture/certs/server.crt;
ssl_certificate_key /fixture/certs/server.key;
ssl_protocols TLSv1.2 TLSv1.3;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Port 8443;
proxy_set_header X-Forwarded-For $remote_addr;
server {
  listen 8443 ssl;
  server_name auth.oidc.test;
  location / { proxy_pass http://keycloak:8080; }
}
server {
  listen 8443 ssl;
  server_name console.oidc.test;
  location / { proxy_pass http://frontend:3100; }
}
server {
  listen 8443 ssl;
  server_name api.oidc.test;
  location / { proxy_pass http://backend:8000; }
}
server {
  listen 8081;
  location = /health { return 200 'ok'; }
}
