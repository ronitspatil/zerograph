x-production: &production
  ZG_ENVIRONMENT: production
  ZG_DEMO_MODE: "false"
  ZG_OIDC_ISSUER: https://auth.oidc.test:8443/realms/zerograph
  ZG_OIDC_JWKS_URL: https://auth.oidc.test:8443/realms/zerograph/protocol/openid-connect/certs
  ZG_OIDC_AUDIENCE: zerograph-api
  SSL_CERT_FILE: /fixture/certs/ca.crt

services:
  backend:
    environment: *production
    volumes: ["${ZG_OIDC_FIXTURE_DIR:?}/certs:/fixture/certs:ro"]
  worker:
    environment: *production
    volumes: ["${ZG_OIDC_FIXTURE_DIR:?}/certs:/fixture/certs:ro"]
  scheduler:
    environment: *production
    volumes: ["${ZG_OIDC_FIXTURE_DIR:?}/certs:/fixture/certs:ro"]
  migrate:
    environment: *production
    volumes: ["${ZG_OIDC_FIXTURE_DIR:?}/certs:/fixture/certs:ro"]
  frontend:
    environment:
      ZG_ENVIRONMENT: production
      ZG_DEMO_MODE: "false"
      ZG_COOKIE_SECURE: "true"
      ZG_PUBLIC_URL: https://console.oidc.test:8443
      ZG_OIDC_ISSUER: https://auth.oidc.test:8443/realms/zerograph
      ZG_OIDC_CLIENT_ID: zerograph-web
      NODE_EXTRA_CA_CERTS: /fixture/certs/ca.crt
    volumes: ["${ZG_OIDC_FIXTURE_DIR:?}/certs:/fixture/certs:ro"]
    ports: !reset []
  oidc-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${OIDC_DB_PASSWORD:?}
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes: [oidc-postgres-data:/var/lib/postgresql/data]
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: [start, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://oidc-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${OIDC_DB_PASSWORD:?}
      KC_HOSTNAME: https://auth.oidc.test:8443
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes: ["${ZG_OIDC_FIXTURE_DIR:?}/realm:/opt/keycloak/data/import:ro"]
    networks: [internal]
    depends_on:
      oidc-postgres: {condition: service_healthy}
    mem_limit: 1g
  oidc-proxy:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./deploy/oidc-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${ZG_OIDC_FIXTURE_DIR:?}/certs:/fixture/certs:ro
    networks:
      internal:
        aliases: [auth.oidc.test, console.oidc.test, api.oidc.test]
    depends_on:
      frontend: {condition: service_healthy}
      keycloak: {condition: service_started}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O- http://127.0.0.1:8081/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  oidc-postgres-data:
