# Kubernetes side of the demo: a research agent and an ops bot.
apiVersion: v1
kind: Namespace
metadata:
  name: ai
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: research-agent
  namespace: ai
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-bot
  namespace: ai
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: triage-bot
  namespace: ai
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: llm-keys
  namespace: ai
type: Opaque
stringData:
  OPENAI_API_KEY: placeholder-value-never-shown
---
apiVersion: v1
kind: Secret
metadata:
  name: warehouse-creds
  namespace: ai
data:
  username: cmVhZGVy
  password: bm90LWEtcmVhbC1wYXNzd29yZA==
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-agent
  namespace: ai
spec:
  template:
    spec:
      serviceAccountName: research-agent
      containers:
        - name: agent
          image: example/research-agent:1.4
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: {name: llm-keys, key: OPENAI_API_KEY}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ops-bot
  namespace: ai
  labels:
    zerograph.io/agent: "true"
spec:
  schedule: "*/15 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: ops-bot
          hostNetwork: true
          volumes:
            - name: host-etc
              hostPath: {path: /etc}
          containers:
            - name: bot
              image: example/ops-bot:0.9
---
apiVersion: v1
kind: Service
metadata:
  name: research-agent
  namespace: ai
spec:
  ports: [{port: 80}]
