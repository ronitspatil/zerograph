[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zerograph"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2", "celery[redis]>=5.4,<6", "redis>=5.2,<7",
  "neo4j>=5.26,<6", "boto3>=1.35,<2", "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3", "loguru>=0.7,<1", "networkx>=3.4,<4", "prometheus-client>=0.22,<1"
]

[project.optional-dependencies]
classifier = ["presidio-analyzer>=2.2,<3", "presidio-anonymizer>=2.2,<3"]
cloud = ["google-cloud-iam>=2.17,<3", "azure-identity>=1.19,<2", "okta>=2.9,<3"]
test = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.graph" = ["migrations/**/*.cypher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
