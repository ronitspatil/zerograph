name: ZeroGraph checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r backend/requirements-dev.lock -e backend
      - run: ruff check backend
      - run: pytest --cov-fail-under=75
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  graph-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        graph: [memgraph, neo4j]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r backend/requirements-dev.lock -e backend
      - if: matrix.graph == 'memgraph'
        run: docker run -d --name graph -p 7687:7687 memgraph/memgraph:3.2.0
      - if: matrix.graph == 'neo4j'
        run: docker run -d --name graph -p 7687:7687 -e NEO4J_AUTH=none neo4j:5.26-community
      - run: pytest tests/test_graph_integration.py -v --no-cov
        working-directory: backend
        env:
          ZG_INTEGRATION_GRAPH: ${{ matrix.graph }}
          ZG_GRAPH_URI: bolt://localhost:7687
