name: ZeroGraph checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zerograph_ingestion_test
          POSTGRES_USER: zerograph_test
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zerograph_test -d zerograph_ingestion_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ZG_INGESTION_POSTGRES_URL: postgresql+psycopg://zerograph_test:disposable-ci-only@localhost:5432/zerograph_ingestion_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r backend/requirements-dev.lock -e backend
      - run: ruff check backend
      - run: pytest --cov-fail-under=75
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  graph-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        graph: [memgraph, neo4j]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r backend/requirements-dev.lock -e backend
      - if: matrix.graph == 'memgraph'
        run: docker run -d --name graph -p 7687:7687 memgraph/memgraph:3.2.0
      - if: matrix.graph == 'neo4j'
        run: docker run -d --name graph -p 7687:7687 -e NEO4J_AUTH=none neo4j:5.26-community
      - run: pytest tests/test_graph_integration.py -v --no-cov
        working-directory: backend
        env:
          ZG_INTEGRATION_GRAPH: ${{ matrix.graph }}
          ZG_GRAPH_URI: bolt://localhost:7687
      - if: failure()
        run: docker logs graph
      - if: always()
        run: docker rm -f graph
  compose-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: zerograph-ci
      ZG_E2E_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r backend/requirements-dev.lock -e backend
      - name: Generate disposable local configuration
        run: python deploy/init_env.py
      - name: Build and start real application stack
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Exercise session, ingestion queue, analysis and remediation
        run: pytest tests/test_stack_e2e.py -v --no-cov
        working-directory: backend
      - name: Capture bounded failure diagnostics
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 150
      - name: Remove disposable services and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: azure/setup-helm@v4.3.1
        with: {version: v3.17.3}
      - run: pip install PyYAML==6.0.2
      - run: helm lint deploy/helm/zerograph --strict
      - run: python -m unittest discover -s deploy/tests -v
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r backend/requirements.lock --no-deps --disable-pip
