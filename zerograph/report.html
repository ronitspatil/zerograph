<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  --bg: #f5f4f1; --panel: rgba(255, 255, 255, 0.72); --line: rgba(28, 25, 23, 0.08); --text: #23211f;
  --muted: #7b7670; --label: rgba(60, 56, 52, 0.62); --accent: #b4534b; --accent-soft: rgba(180, 83, 75, 0.09);
  --agent: #3b4654; --identity: #5b86ad; --tool: #6f9160; --secret: #c98f35; --resource: #b4534b;
  --e-uses: #8aa67c; --e-runs: #7c9dbd; --e-secret: #d3a457; --e-priv: #c4776f; --e-net: #8d8780;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #242424; --panel: rgba(36, 36, 36, 0.78); --line: rgba(255, 255, 255, 0.07); --text: #e8e6e3;
    --muted: #9a958f; --label: rgba(222, 218, 212, 0.5); --accent: #d4746b; --accent-soft: rgba(212, 116, 107, 0.12);
    --agent: #ece4d4; --identity: #82a9cb; --tool: #9cb68a; --secret: #e6b56c; --resource: #cf6b62;
    --e-uses: #8ea67f; --e-runs: #7896b2; --e-secret: #c9a065; --e-priv: #b9665e; --e-net: #a7a29b;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); overflow: hidden;
  font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#graph { position: fixed; inset: 0 var(--pw, 316px) 0 0; transition: right 0.2s ease; }
body.collapsed #graph { right: 0; }
#cy { position: absolute; inset: 0; }
#offline { position: absolute; inset: 0; display: none; place-items: center; color: var(--muted);
  padding: 32px; text-align: center; }
#search { position: absolute; top: 16px; left: 16px; width: 220px; padding: 6px 10px 6px 28px; z-index: 2;
  background: transparent; border: 1px solid var(--line); border-radius: 6px; color: var(--text); font: inherit;
  font-size: 12px; outline: none; background-image: radial-gradient(circle at 12px 50%, transparent 3.5px, var(--muted) 4px, transparent 5px); }
#search:focus { border-color: var(--muted); }
#search::placeholder { color: var(--muted); }
.legend { position: absolute; left: 18px; bottom: 16px; z-index: 2; font-size: 11px; color: var(--muted);
  pointer-events: none; line-height: 1.75; }
.legend b { display: block; color: var(--text); font-weight: 600; font-size: 12px; margin-bottom: 2px; }
.legend i { display: inline-block; vertical-align: middle; margin-right: 8px; }
.legend .ln { width: 18px; border-top: 2px solid var(--c); opacity: 0.85; }
.legend .ln.dot { border-top-style: dotted; border-top-width: 2px; }
.legend .dt { width: 7px; height: 7px; border-radius: 50%; background: var(--c); margin: 0 13px 0 6px; }
.legend .hub { width: 11px; height: 11px; border-radius: 50%; background: var(--c); margin: 0 11px 0 4px;
  box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--c); }
aside { position: fixed; top: 0; right: 0; bottom: 0; width: 316px; display: flex; flex-direction: column;
  background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-left: 1px solid var(--line); min-height: 0; transition: transform 0.2s ease; z-index: 3; }
body.collapsed aside { transform: translateX(100%); }
#toggle { position: absolute; left: -30px; top: 14px; width: 24px; height: 24px; border: 1px solid var(--line);
  border-radius: 6px; background: var(--panel); color: var(--muted); cursor: pointer; font-size: 14px; line-height: 1; padding: 0; }
header { padding: 18px 18px 10px; }
h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin-top: 2px; font-size: 11.5px; }
.scroll { overflow-y: auto; flex: 1; min-height: 0; padding: 0 0 16px; scrollbar-width: thin; }
h2 { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--muted); margin: 12px 18px 4px; }
ol { list-style: none; margin: 0; padding: 0; }
.agent { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; padding: 6px 18px;
  cursor: pointer; border-left: 2px solid transparent; }
.agent:hover { background: var(--accent-soft); }
.agent.on { border-left-color: var(--accent); background: var(--accent-soft); }
.agent .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent .score { font-variant-numeric: tabular-nums; font-weight: 600; }
.agent .meta { grid-column: 1 / -1; color: var(--muted); font-size: 11px; }
.critical { color: var(--accent); }
#detail { padding: 4px 18px 0; margin-top: 10px; border-top: 1px solid var(--line); }
#detail:empty { display: none; }
#detail .title { font-weight: 600; font-size: 13.5px; margin-top: 2px; word-break: break-word; }
.finding { padding: 7px 0; border-bottom: 1px solid var(--line); }
.finding:last-child { border-bottom: 0; }
.finding .row { display: flex; justify-content: space-between; gap: 10px; }
.sev { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.sev.top { color: var(--accent); }
.via { color: var(--muted); font-size: 11px; margin-top: 2px; }
code { font: 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted);
  white-space: nowrap; margin-right: 8px; }
.hint { color: var(--muted); padding: 0 18px; font-size: 11.5px; }
details { margin: 12px 18px 0; color: var(--muted); font-size: 11.5px; }
details li { margin: 4px 0; }
</style>
</head>
<body>
<section id="graph"><div id="cy"></div>
  <input id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false">
  <div id="offline">The graph view needs cytoscape.js from a CDN. The panel on the right still lists every agent's blast radius.</div>
  <div class="legend" id="legend"></div>
</section>
<aside>
  <button id="toggle" title="Toggle panel" aria-label="Toggle panel">›</button>
  <header><h1>ZeroGraph</h1><div class="sub" id="counts"></div></header>
  <div class="scroll">
    <h2>Agents by blast radius</h2>
    <ol id="agents"></ol>
    <p class="hint" id="hint">Click an agent, or any node, to see what it can reach if compromised. Click the background to clear.</p>
    <div id="detail"></div>
    <div id="warnings"></div>
  </div>
</aside>
<script id="data" type="application/json">__DATA__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"
  integrity="sha384-IWROdLKRsN1UuJywMlWl7/blXQ8GEooN2n7dzTxfEPd7ybYIKCUJ2Ol/1Gpf3YV4"
  crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(function () {
  "use strict";
  const data = JSON.parse(document.getElementById("data").textContent);
  const byId = Object.fromEntries(data.nodes.map((n) => [n.id, n]));
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  let cy = null, selected = null;

  const kinds = {};
  data.nodes.forEach((n) => { kinds[n.kind] = (kinds[n.kind] || 0) + 1; });
  document.getElementById("counts").textContent =
    `${kinds.agent || 0} agents · ${kinds.identity || 0} identities · ${kinds.tool || 0} tools · ` +
    `${kinds.secret || 0} secrets · ${kinds.resource || 0} privileges`;

  // Edge families, by what the edge does. Network reach (and other non-transitive edges) is dotted.
  const families = [["uses", "uses tool"], ["runs", "runs as / bound to"], ["secret", "holds secret"],
    ["priv", "grants privilege"], ["net", "network reach"]];
  const family = (e) => {
    if (!e.transitive || /^(attached to|can reach)/.test(e.rel)) return "net";
    const k = (byId[e.target] || {}).kind;
    return k === "tool" ? "uses" : k === "identity" ? "runs" : k === "secret" ? "secret" : "priv";
  };
  document.getElementById("legend").innerHTML = "<b>Legend</b>" +
    families.map(([f, name]) => `<div><i class="ln${f === "net" ? " dot" : ""}" style="--c: var(--e-${f})"></i>${name}</div>`).join("") +
    `<div><i class="hub" style="--c: var(--agent)"></i>agent</div>` +
    [["identity", "identity"], ["tool", "tool"], ["secret", "secret"], ["resource", "privilege"]]
      .map(([k, name]) => `<div><i class="dt" style="--c: var(--${k})"></i>${name}</div>`).join("");

  const list = document.getElementById("agents");
  list.innerHTML = data.agents.length ? data.agents.map((a) => `
    <li class="agent" data-id="${esc(a.id)}">
      <span class="name" title="${esc(a.label)}">${esc(a.label)}</span>
      <span class="score ${a.rating === "critical" ? "critical" : ""}">${a.score}</span>
      <span class="meta">${esc(a.rating)} · ${a.findings.length} reachable privileges and secrets</span>
    </li>`).join("") : `<p class="hint">No agents found.</p>`;
  list.addEventListener("click", (e) => {
    const li = e.target.closest(".agent");
    if (li) select(li.dataset.id);
  });

  if (data.warnings.length) {
    document.getElementById("warnings").innerHTML = `<details><summary>${data.warnings.length} warning(s)</summary>
      <ul>${data.warnings.map((w) => `<li>${esc(w)}</li>`).join("")}</ul></details>`;
  }

  document.getElementById("toggle").addEventListener("click", () => {
    const on = document.body.classList.toggle("collapsed");
    document.getElementById("toggle").textContent = on ? "‹" : "›";
    if (cy) setTimeout(() => { cy.resize(); refit(); }, 220);
  });

  function evidence(path) {
    return path.map((s) => s.evidence).filter(Boolean)
      .filter((v, i, a) => a.indexOf(v) === i).map((v) => `<code>${esc(v)}</code>`).join(" ");
  }

  function renderDetail(id) {
    const el = document.getElementById("detail");
    if (!id) { el.innerHTML = ""; return; }
    const node = byId[id], r = data.radii[id];
    const head = `<h2 style="margin-left:0">Selected ${esc(node.kind)}</h2><div class="title">${esc(node.label)}</div>
      <div class="sub">${node.file ? `<code>${esc(node.file)}${node.line ? ":" + node.line : ""}</code> · ` : ""}` +
      (r ? `score <b>${r.score}</b> · <span class="${r.rating === "critical" ? "critical" : ""}">${esc(r.rating)}</span>` : "reaches nothing") + `</div>`;
    const top = r && r.findings.length ? r.findings[0].severity : 0;
    const rows = r ? r.findings.map((f) => {
      const hops = f.path.slice(0, -1).map((s) => esc(s.to));
      return `<div class="finding"><div class="row"><span>${esc(f.label)}</span>
        <span class="sev ${f.severity === top ? "top" : ""}">${f.severity}</span></div>
        ${hops.length ? `<div class="via">via ${hops.join(" → ")}</div>` : ""}
        <div class="via">${evidence(f.path)}</div></div>`;
    }).join("") : "";
    el.innerHTML = head + (rows ? `<h2 style="margin-left:0">Reachable privileges and secrets</h2>${rows}` : "");
  }

  // Fit like cy.fit, but never zoom past 1.25 so a small subgraph stays airy instead of filling the screen.
  const fitTo = (eles, pad) => {
    const bb = eles.boundingBox();
    const zoom = Math.min(1.25, (cy.width() - 2 * pad) / bb.w, (cy.height() - 2 * pad) / bb.h);
    cy.stop(true).animate({ zoom, pan: { x: cy.width() / 2 - zoom * (bb.x1 + bb.w / 2), y: cy.height() / 2 - zoom * (bb.y1 + bb.h / 2) } },
      { duration: 450, easing: "ease-in-out-cubic" });
  };
  const refit = () => {
    if (!cy) return;
    const focus = cy.elements(".focus");
    fitTo(focus.nonempty() ? focus : cy.elements(), focus.nonempty() ? 90 : 56);
  };

  function select(id) {
    if (id && !byId[id]) id = null;
    selected = id;
    document.querySelectorAll(".agent").forEach((li) => li.classList.toggle("on", li.dataset.id === id));
    renderDetail(id);
    document.getElementById("hint").style.display = id ? "none" : "";
    if (!cy) return;
    cy.elements().removeClass("dim focus origin match");
    if (!id) { refit(); return; }
    const r = data.radii[id];
    const keep = new Set([id, ...(r ? r.reachable : [])]);
    const edges = new Set((r ? r.edges : []).map((e) => e.join("|")));
    cy.nodes().forEach((n) => n.addClass(keep.has(n.id()) ? "focus" : "dim"));
    cy.edges().forEach((e) => e.addClass(edges.has([e.data("source"), e.data("target"), e.data("rel")].join("|")) ? "focus" : "dim"));
    cy.getElementById(id).addClass("origin");
    refit();
  }

  function style() {
    const size = (n) => 7 + Math.min(n.data("severity"), 10) * 0.35 + Math.min(n.degree(), 8) * 0.6;
    return [
      { selector: "node", style: {
        "background-color": (n) => css("--" + n.data("kind")), width: size, height: size, "border-width": 0,
        label: "data(short)", "font-size": 7, color: css("--label"), "text-valign": "bottom", "text-halign": "center",
        "text-margin-y": 3, "font-family": "ui-sans-serif, system-ui, -apple-system, sans-serif",
        "text-max-width": 96, "text-wrap": "wrap", "min-zoomed-font-size": 7,
        "text-outline-color": css("--bg"), "text-outline-width": 1.6, "text-outline-opacity": 0.85,
        "transition-property": "opacity", "transition-duration": 250 } },
      { selector: "node[deg >= 3]", style: { "min-zoomed-font-size": 4 } },
      { selector: "node[kind = 'agent']", style: { width: 20, height: 20, "border-width": 2.5,
        "border-color": css("--bg"), "outline-width": 1.5, "outline-color": css("--agent"), "outline-opacity": 0.55,
        "font-size": 8.5, "font-weight": 600, color: css("--text"), "text-margin-y": 5, "min-zoomed-font-size": 0 } },
      { selector: "node[kind = 'identity'][deg >= 3]", style: { width: 13, height: 13 } },
      { selector: "edge", style: { width: 1, "line-color": (e) => css("--e-" + e.data("fam")),
        "target-arrow-color": (e) => css("--e-" + e.data("fam")), "target-arrow-shape": "triangle",
        "arrow-scale": 0.45, "curve-style": "straight", opacity: 0.6, "font-size": 7, color: css("--muted"),
        "text-background-color": css("--bg"), "text-background-opacity": 1, "text-background-padding": 2,
        "text-rotation": "autorotate", "transition-property": "opacity", "transition-duration": 250 } },
      { selector: "edge[fam = 'net']", style: { "line-style": "dotted", "target-arrow-shape": "none", width: 1.3 } },
      { selector: "edge.hover", style: { label: "data(rel)", "z-index": 10 } },
      { selector: "node:active, node:selected", style: { "overlay-opacity": 0 } },
      { selector: "node.hover, node.focus, node.match", style: { "min-zoomed-font-size": 0, color: css("--text") } },
      { selector: "edge.focus", style: { width: 1.6, opacity: 0.95 } },
      { selector: ".dim", style: { opacity: 0.1, "text-opacity": 0 } },
      { selector: "node.origin", style: { "outline-color": css("--accent"), "outline-opacity": 1, "outline-width": 2 } },
    ];
  }

  // Force-directed layout made deterministic: Math.random is swapped for a seeded generator
  // while the layout runs, so a reload always lands on the same picture.
  function layout() {
    const real = Math.random;
    let seed = 7;
    Math.random = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
    try {
      cy.layout({
        name: "cose", randomize: true, animate: false, fit: false, nodeDimensionsIncludeLabels: false,
        idealEdgeLength: (e) => (e.data("fam") === "net" ? 70 : 42), edgeElasticity: () => 100,
        nodeRepulsion: (n) => (n.data("kind") === "agent" ? 60000 : 9000), nodeOverlap: 20, gravity: 1.2,
        componentSpacing: 60, nestingFactor: 1, numIter: 3000, initialTemp: 400, coolingFactor: 0.96, minTemp: 1,
      }).run();
    } finally { Math.random = real; }
    cy.fit(undefined, 56);
  }

  function search(q) {
    q = q.trim().toLowerCase();
    if (selected) select(null);
    cy.elements().removeClass("dim match");
    if (!q) { refit(); return; }
    const hits = cy.nodes().filter((n) => n.data("label").toLowerCase().includes(q) || n.id().toLowerCase().includes(q));
    if (!hits.length) return;
    const near = hits.union(hits.connectedEdges()).union(hits.neighborhood("node"));
    hits.addClass("match");
    cy.elements().difference(near).addClass("dim");
    fitTo(near, 90);
  }

  renderDetail(null);
  if (!window.cytoscape) {
    document.getElementById("offline").style.display = "grid";
    document.getElementById("search").style.display = document.getElementById("legend").style.display = "none";
    return;
  }

  const degree = {};
  data.edges.forEach((e) => { degree[e.source] = (degree[e.source] || 0) + 1; degree[e.target] = (degree[e.target] || 0) + 1; });
  cy = cytoscape({
    container: document.getElementById("cy"),
    wheelSensitivity: 0.25, minZoom: 0.2, maxZoom: 4, boxSelectionEnabled: false,
    elements: [
      ...data.nodes.map((n) => ({ data: { id: n.id, kind: n.kind, severity: n.severity, label: n.label, deg: degree[n.id] || 0,
        short: n.label.replace(/\s*\([^)]*\)$/, "") } })),
      ...data.edges.map((e, i) => ({ data: { id: "e" + i, source: e.source, target: e.target, rel: e.rel, fam: family(e) } })),
    ],
    style: [],
    layout: { name: "preset" },
  });
  cy.style(style());
  layout();
  cy.on("tap", "node", (e) => select(e.target.id()));
  cy.on("tap", (e) => { if (e.target === cy) { document.getElementById("search").value = ""; select(null); } });
  cy.on("mouseover", "node", (e) => e.target.addClass("hover"));
  cy.on("mouseout", "node", (e) => e.target.removeClass("hover"));
  cy.on("mouseover", "edge", (e) => e.target.addClass("hover"));
  cy.on("mouseout", "edge", (e) => e.target.removeClass("hover"));
  const box = document.getElementById("search");
  box.addEventListener("input", () => search(box.value));
  box.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { box.value = ""; search(""); }
    if (e.key === "Enter") { const m = cy.nodes(".match"); if (m.length === 1) select(m.id()); }
  });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => cy.style(style()));
  window.zerograph = { cy, select, search };
  if (location.hash.length > 1) select(decodeURIComponent(location.hash.slice(1)));
})();
</script>
</body>
</html>
